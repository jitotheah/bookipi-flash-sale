# Local stand-ins for the managed services the design assumes in production
# (ElastiCache / MemoryDB + RDS). Nothing here is required for the default
# in-memory driver -- bring it up when you start GUIDE.md step 3.
services:
  redis:
    image: redis:7-alpine
    # appendonly + everysec: at most ~1s of acknowledged reservations lost on a
    # hard crash. See GUIDE.md step 6 for why that is an acceptable trade.
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashsale
    ports: [ "5432:5432" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flash" ]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
